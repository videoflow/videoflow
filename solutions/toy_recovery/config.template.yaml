# Toy-recovery config template. `videoflow deploy toy_recovery.py` reads this
# when no config.yaml exists: it asks the x-questions below, writes config.yaml,
# and hostPath-mounts the x-mounts paths into the prep container and the worker
# pods. See config.example.yaml for what every knob means.
work_dir: ./out
events: 40
rate_fps: 200
max_retries: 3
fragile:
  poison_values: [7, 23]
  crash_at: 15

# Inputs `videoflow deploy` asks for when generating config.yaml.
x-questions:
  - key: events
    prompt: 'Number of events to produce'
    type: int
    default: 40
  - key: fragile.crash_at
    prompt: 'Event at which the worker dies once (recoverable; -1 to skip)'
    type: int
    default: 15
  - key: max_retries
    prompt: 'Redeliveries before a transient failure is dead-lettered'
    type: int
    default: 3

# The work dir must be visible inside prep containers and worker pods at the
# same absolute path: it holds expected_recovery.json (written by prepare.py,
# read by the ledger) and receives ledger.jsonl and recovery_report.json.
x-mounts:
  - '{work_dir}'
