apiVersion: batch/v1
kind: Job
metadata:
  name: vf-golden-toy-router-count
  labels: &id001
    videoflow.io/flow-id: golden-toy-router
    app.kubernetes.io/managed-by: videoflow
    videoflow.io/node: count
    videoflow.io/run-id: run0
  namespace: videoflow-test
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: worker
        image: videoflow-base:py3.12
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: vf-golden-toy-router-count-env
        - configMapRef:
            name: vf-golden-toy-router-broker
        env:
        - name: VF_REPLICA_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        ports:
        - containerPort: 8080
          name: health
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - name: vf-mount-0
          mountPath: <ROOT>/toy_router
          readOnly: false
      volumes:
      - name: vf-mount-0
        hostPath:
          path: <ROOT>/toy_router
      restartPolicy: Never
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 86400
  completionMode: Indexed
  completions: 3
  parallelism: 3
---
