  namespace: videoflow-test
spec:
  podSelector:
    matchLabels:
      videoflow.io/flow-id: golden-toy-recovery
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          videoflow.io/flow-id: golden-toy-recovery
---
