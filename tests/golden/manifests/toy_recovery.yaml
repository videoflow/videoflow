    videoflow.io/run-id: run0
  namespace: videoflow-test
data:
  VF_NATS_URL: nats://nats.videoflow-test.svc:4222
  VF_BLOB_REDIS_URL: redis://redis.videoflow-test.svc:6379/0
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
