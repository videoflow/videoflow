apiVersion: batch/v1
kind: Job
metadata:
  name: vf-golden-toy-recovery-provision
  labels: &id001
    videoflow.io/flow-id: golden-toy-recovery
    app.kubernetes.io/managed-by: videoflow
    videoflow.io/run-id: run0
  namespace: videoflow-test
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: OnFailure
      containers:
      - name: provision
        image: videoflow-base:py3.12
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - videoflow.provision
        terminationMessagePolicy: FallbackToLogsOnError
        envFrom:
        - configMapRef:
            name: vf-golden-toy-recovery-broker
        env:
        - name: VF_FLOW_ID
          value: golden-toy_recovery
        - name: VF_RUN_ID
          value: run0
        - name: VF_FLOW_TYPE
          value: batch
        - name: VF_FLOW_SPECS_PATH
          value: /etc/videoflow/specs.json
        volumeMounts:
        - name: specs
          mountPath: /etc/videoflow
          readOnly: true
      volumes:
      - name: specs
        configMap:
          name: vf-golden-toy-recovery-specs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vf-golden-toy-recovery-events-env
  labels:
    videoflow.io/flow-id: golden-toy-recovery
    app.kubernetes.io/managed-by: videoflow
    videoflow.io/node: events
    videoflow.io/run-id: run0
  namespace: videoflow-test
data:
  VF_NODE_PARAMS_JSON: '{"name": "events", "image": null, "is_finite": true, "count":
    24, "rate_fps": 400.0}'
  VF_NODE_KIND: producer
  VF_NODE_NAME: events
  VF_PARENT_NAMES: ''
  VF_HAS_CHILDREN: '1'
  VF_FLOW_ID: golden-toy_recovery
  VF_FLOW_TYPE: batch
  VF_RUN_ID: run0
  VF_NB_TASKS: '1'
  VF_HEALTH_PORT: '8080'
  VF_ENVELOPE_VERSION: '4'
  VF_NODE_CLASS: toy_recovery_nodes.EventProducer
  VF_BLOB_READERS: '1'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vf-golden-toy-recovery-events
  labels: &id001
    videoflow.io/flow-id: golden-toy-recovery
    app.kubernetes.io/managed-by: videoflow
    videoflow.io/node: events
    videoflow.io/run-id: run0
  namespace: videoflow-test
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: worker
        image: videoflow-base:py3.12
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: vf-golden-toy-recovery-events-env
        - configMapRef:
            name: vf-golden-toy-recovery-broker
        ports:
        - containerPort: 8080
          name: health
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - name: vf-mount-0
          mountPath: <ROOT>/toy_recovery
          readOnly: false
      volumes:
      - name: vf-mount-0
        hostPath:
          path: <ROOT>/toy_recovery
      restartPolicy: Never
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 86400
---
