apiVersion: apps/v1
kind: Deployment
metadata:
  name: vf-golden-demo-gpu-sharer
  labels: &id001
    videoflow.io/flow-id: golden-demo
    app.kubernetes.io/managed-by: videoflow
    videoflow.io/node: gpu-sharer
    videoflow.io/run-id: run0
  namespace: videoflow-test
spec:
  replicas: 2
  selector:
    matchLabels:
      videoflow.io/node: gpu-sharer
      videoflow.io/flow-id: golden-demo
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: worker
        image: videoflow-base:py3.12
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: vf-golden-demo-gpu-sharer-env
        - configMapRef:
            name: vf-golden-demo-broker
        resources:
          limits:
            nvidia.com/gpu: 1
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 2
          failureThreshold: 60
        ports:
        - containerPort: 8080
          name: health
        terminationMessagePolicy: FallbackToLogsOnError
      nodeSelector:
        videoflow.io/gpu-pool: 'true'
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      runtimeClassName: nvidia
