apiVersion: batch/v1
kind: Job
metadata:
  name: vf-golden-demo-provision
  labels: &id001
    videoflow.io/flow-id: golden-demo
    app.kubernetes.io/managed-by: videoflow
    videoflow.io/run-id: run0
  namespace: videoflow-test
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: OnFailure
      containers:
      - name: provision
        image: videoflow-base:py3.12
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - videoflow.provision
        terminationMessagePolicy: FallbackToLogsOnError
        envFrom:
        - configMapRef:
            name: vf-golden-demo-broker
        env:
        - name: VF_FLOW_ID
          value: golden-demo
        - name: VF_RUN_ID
          value: run0
        - name: VF_FLOW_TYPE
          value: realtime
        - name: VF_FLOW_SPECS_PATH
          value: /etc/videoflow/specs.json
        volumeMounts:
        - name: specs
          mountPath: /etc/videoflow
          readOnly: true
      volumes:
