apiVersion: apps/v1
kind: Deployment
metadata:
  name: vf-golden-toy-fusion-fuse
  labels: &id001
    videoflow.io/flow-id: golden-toy-fusion
    app.kubernetes.io/managed-by: videoflow
    videoflow.io/node: fuse
    videoflow.io/run-id: run0
  namespace: videoflow-test
spec:
  replicas: 1
  selector:
    matchLabels:
      videoflow.io/node: fuse
      videoflow.io/flow-id: golden-toy-fusion
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: worker
        image: videoflow-base:py3.12
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: vf-golden-toy-fusion-fuse-env
        - configMapRef:
            name: vf-golden-toy-fusion-broker
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 2
          failureThreshold: 60
        ports:
        - containerPort: 8080
          name: health
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - name: vf-mount-0
          mountPath: <ROOT>/toy_fusion
          readOnly: false
      volumes:
      - name: vf-mount-0
        hostPath:
          path: <ROOT>/toy_fusion
---
