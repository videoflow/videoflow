apiVersion: batch/v1
kind: Job
metadata:
  name: vf-golden-toy-fusion-provision
  labels: &id001
    videoflow.io/flow-id: golden-toy-fusion
    app.kubernetes.io/managed-by: videoflow
    videoflow.io/run-id: run0
  namespace: videoflow-test
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: OnFailure
      containers:
      - name: provision
        image: videoflow-base:py3.12
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - videoflow.provision
        terminationMessagePolicy: FallbackToLogsOnError
        envFrom:
        - configMapRef:
            name: vf-golden-toy-fusion-broker
        env:
        - name: VF_FLOW_ID
          value: golden-toy_fusion
        - name: VF_RUN_ID
          value: run0
        - name: VF_FLOW_TYPE
          value: realtime
        - name: VF_FLOW_SPECS_PATH
          value: /etc/videoflow/specs.json
        volumeMounts:
        - name: specs
          mountPath: /etc/videoflow
          readOnly: true
      volumes:
      - name: specs
        configMap:
          name: vf-golden-toy-fusion-specs
---
