# Pre-commit hooks for videoflow.
#   pre-commit install                      # enable the commit-stage hooks
#   pre-commit install --hook-type pre-push # enable the pytest pre-push hook
#
# Commit stage: fast file-hygiene checks, ruff lint (auto-fix), and mypy type checks.
# Push stage: the unit suite (too slow to run on every commit). The integration
# buckets need a local NATS JetStream server and the backend conformance suite is
# a several-minute run of its own; both are run explicitly (see CONTRIBUTING.md).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # k8s manifests bundle several resources per file with `---` separators.
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
        # Default is 500kB, which the built white-paper PDF (~800kB, and growing
        # with each figure added) exceeds. 2MB still catches the mistakes this
        # hook is for — committed model weights, datasets, sample videos.
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      # Run mypy through uv so it uses the project environment (real deps like
      # redis/opencv/nats and the [tool.mypy] config in pyproject.toml) rather than
      # an isolated env with a hand-maintained, drift-prone stub list.
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        files: ^videoflow/
        pass_filenames: false

      - id: pytest
        name: pytest (unit suite)
        # tests/integration/ needs a live NATS JetStream server and
        # tests/conformance/ is the 130-case backend suite (minutes, mostly waiting
        # on model time), so both are excluded here — run them explicitly with
        # `uv run pytest tests/integration` and `uv run pytest tests/conformance -q -rs`.
        entry: uv run pytest --ignore=tests/integration --ignore=tests/conformance
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
